<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SARI SARI ORDER FORM</title>
<style>body{font-family:Arial,sans-serif;background:#fff7dd;margin:0;padding:24px;color:#322}.wrap{max-width:640px;margin:auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0002}h1{margin-top:0;color:#7b4d00}.product-img{width:86px;height:70px;object-fit:cover;border-radius:12px;border:1px solid #ead9b8}.item{display:grid;grid-template-columns:86px 1fr 130px;gap:15px;align-items:center;padding:16px 0;border-bottom:1px solid #eee}input,select,button{box-sizing:border-box;width:100%;font-size:16px;padding:12px;border:1px solid #bbb;border-radius:10px}button{margin-top:22px;background:#7b4d00;color:#fff;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:16px;font-weight:bold}.ok{color:#18723c}.err{color:#a51b1b}@media(max-width:520px){.item{grid-template-columns:70px 1fr 90px}.product-img{width:70px;height:60px}}</style></head>
<body><main class="wrap"><h1>SARI SARI ORDER FORM</h1><p>Enter your name and select your quantities.</p><form id="orderForm"><label for="name"><b>Name</b></label><input id="name" required maxlength="80" placeholder="Your name"><div class="item"><img class="product-img" src="BALOT.PNG.png" alt="Balot"><span><b>Balot</b><br><small>₱25 each</small></span><select id="balot"></select></div><div class="item"><img class="product-img" src="penoy.png.png" alt="Penoy"><span><b>Penoy</b><br><small>₱20 each</small><br><label for="penoyType" style="font-size:13px">Type</label><select id="penoyType" style="margin-top:6px;padding:7px"><option value="Sabaw">Sabaw</option><option value="Tuyo">Tuyo</option></select></span><select id="penoy"></select></div><div class="item"><img class="product-img" src="Pugo.png.png" alt="Pugo"><span><b>Pugo</b><br><small>₱5 each</small></span><select id="pugo"></select></div><div class="item"><img class="product-img" src="Suka small.jpg" alt="Suka Small"><span><b>Suka Small</b><br><small>₱60 each</small></span><select id="sukaSmall"></select></div><div class="item"><img class="product-img" src="Suka big.jpg" alt="Suka Big"><span><b>Suka Big</b><br><small>₱100 each</small></span><select id="sukaBig"></select></div><div id="total" style="margin-top:18px;font-size:20px;font-weight:bold;color:#7b4d00">Total: ₱0</div><button id="submitBtn" type="submit">Submit Order</button><div id="msg" class="msg" aria-live="polite"></div></form></main>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbwVl0LWfqO7WoKeQsNC-XZewrx11aqrsEpPQJ0hz0Jas69WfzX1RoC8vtUSt6CMwm7G/exec';
['balot','penoy','pugo','sukaSmall','sukaBig'].forEach(id=>{const s=document.getElementById(id);for(let i=0;i<=50;i++){const o=document.createElement('option');o.value=i;o.textContent=i;s.appendChild(o);}s.addEventListener('change',updateTotal);});function updateTotal(){const total=(+balot.value*25)+(+penoy.value*20)+(+pugo.value*5)+(+sukaSmall.value*60)+(+sukaBig.value*100);document.getElementById('total').textContent='Total: ₱'+total.toLocaleString('en-PH');}
document.getElementById('orderForm').addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim();const balot=Number(document.getElementById('balot').value),penoy=Number(document.getElementById('penoy').value),pugo=Number(document.getElementById('pugo').value),penoyType=document.getElementById('penoyType').value,sukaSmall=Number(document.getElementById('sukaSmall').value),sukaBig=Number(document.getElementById('sukaBig').value);const msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');msg.className='msg';if(!name){msg.textContent='Please enter your name.';msg.classList.add('err');return;}if(balot+penoy+pugo+sukaSmall+sukaBig===0){msg.textContent='Please select at least one item.';msg.classList.add('err');return;}btn.disabled=true;btn.textContent='Submitting...';try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name,balot,penoy,penoyType,pugo,sukaSmall,sukaBig,total:(balot*25)+(penoy*20)+(pugo*5)+(sukaSmall*60)+(sukaBig*100)})});msg.textContent='Order submitted!';msg.classList.add('ok');e.target.reset();updateTotal();}catch(err){msg.textContent='Could not submit order. Please try again.';msg.classList.add('err');}finally{btn.disabled=false;btn.textContent='Submit Order';}});
</script></body></html>
